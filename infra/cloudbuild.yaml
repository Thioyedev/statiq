# Cloud Build pipeline — PRODUCTION branch
#
# Full cloud deployment with Redis (Cloud Memorystore), VPC connector,
# API key auth, and complete secret management.
#
# Required substitutions (set in Cloud Build trigger):
#   _REGION           = europe-west1
#   _BACKEND_SERVICE  = statiq-backend
#   _FRONTEND_SERVICE = statiq-frontend
#   _REDIS_HOST       = 10.x.x.x  (Cloud Memorystore IP)
#   _VPC_CONNECTOR    = projects/PROJECT_ID/locations/REGION/connectors/statiq-connector
#
# Required secrets in Secret Manager:
#   anthropic-api-key, api-key, gcp-project-id, gcs-bucket-name,
#   langfuse-public-key, langfuse-secret-key, langfuse-host

substitutions:
  _REGION: europe-west1
  _BACKEND_SERVICE: statiq-backend
  _FRONTEND_SERVICE: statiq-frontend
  _REGISTRY: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/statiq
  _REDIS_HOST: ""
  _VPC_CONNECTOR: ""

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # ── 1. Run unit tests ────────────────────────────────────────────────────────
  - name: "python:3.11-slim"
    id: test
    entrypoint: bash
    args:
      - "-c"
      - |
        pip install -q ".[dev]"
        python -m pytest tests/unit/ -v --tb=short --cov=backend --cov-report=term-missing
    env:
      - "PYTHONPATH=/workspace"
      - "ANTHROPIC_API_KEY=sk-ant-test"
      - "GCP_PROJECT_ID=test-project"
      - "GCS_BUCKET_NAME=test-bucket"

  # ── 2. Build backend image ───────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: build-backend
    waitFor: ["test"]
    args:
      - build
      - -t
      - "${_REGISTRY}/backend:${SHORT_SHA}"
      - -t
      - "${_REGISTRY}/backend:latest"
      - -f
      - Dockerfile.backend
      - .
    env:
      - "DOCKER_BUILDKIT=1"

  # ── 3. Build frontend image ──────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: build-frontend
    waitFor: ["test"]
    args:
      - build
      - -t
      - "${_REGISTRY}/frontend:${SHORT_SHA}"
      - -t
      - "${_REGISTRY}/frontend:latest"
      - -f
      - Dockerfile.frontend
      - .
    env:
      - "DOCKER_BUILDKIT=1"

  # ── 4. Push images ───────────────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: push-backend
    waitFor: ["build-backend"]
    args: ["push", "--all-tags", "${_REGISTRY}/backend"]

  - name: "gcr.io/cloud-builders/docker"
    id: push-frontend
    waitFor: ["build-frontend"]
    args: ["push", "--all-tags", "${_REGISTRY}/frontend"]

  # ── 5. Deploy backend to Cloud Run (full config) ─────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy-backend
    waitFor: ["push-backend"]
    entrypoint: bash
    args:
      - "-c"
      - |
        VPC_ARGS=""
        if [ -n "${_VPC_CONNECTOR}" ]; then
          VPC_ARGS="--vpc-connector=${_VPC_CONNECTOR} --vpc-egress=private-ranges-only"
        fi
        gcloud run deploy ${_BACKEND_SERVICE} \
          --image=${_REGISTRY}/backend:${SHORT_SHA} \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --memory=2Gi \
          --cpu=2 \
          --concurrency=80 \
          --min-instances=0 \
          --max-instances=10 \
          --timeout=300 \
          --set-env-vars=APP_ENV=production,REDIS_HOST=${_REDIS_HOST},REDIS_PORT=6379 \
          --set-secrets=ANTHROPIC_API_KEY=anthropic-api-key:latest \
          --set-secrets=API_KEY=api-key:latest \
          --set-secrets=GCP_PROJECT_ID=gcp-project-id:latest \
          --set-secrets=GCS_BUCKET_NAME=gcs-bucket-name:latest \
          --set-secrets=LANGFUSE_PUBLIC_KEY=langfuse-public-key:latest \
          --set-secrets=LANGFUSE_SECRET_KEY=langfuse-secret-key:latest \
          --set-secrets=LANGFUSE_HOST=langfuse-host:latest \
          --service-account=statiq-backend-sa@${PROJECT_ID}.iam.gserviceaccount.com \
          $${VPC_ARGS}

  # ── 6. Deploy frontend to Cloud Run ─────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy-frontend
    waitFor: ["push-frontend", "deploy-backend"]
    entrypoint: bash
    args:
      - "-c"
      - |
        BACKEND_URL=$(gcloud run services describe ${_BACKEND_SERVICE} \
          --region=${_REGION} --format='value(status.url)')
        API_KEY=$(gcloud secrets versions access latest --secret=api-key)
        gcloud run deploy ${_FRONTEND_SERVICE} \
          --image=${_REGISTRY}/frontend:${SHORT_SHA} \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --memory=1Gi \
          --cpu=1 \
          --concurrency=50 \
          --min-instances=0 \
          --max-instances=5 \
          --set-env-vars=BACKEND_URL=$${BACKEND_URL},API_KEY=$${API_KEY}

  # ── 7. Smoke test ────────────────────────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: smoke-test
    waitFor: ["deploy-backend"]
    entrypoint: bash
    args:
      - "-c"
      - |
        SERVICE_URL=$(gcloud run services describe ${_BACKEND_SERVICE} \
          --region=${_REGION} --format='value(status.url)')
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" $${SERVICE_URL}/health)
        echo "Health check: $${STATUS} — $${SERVICE_URL}/health"
        [ "$${STATUS}" = "200" ] || (echo "Health check failed" && exit 1)

images:
  - "${_REGISTRY}/backend:${SHORT_SHA}"
  - "${_REGISTRY}/frontend:${SHORT_SHA}"
