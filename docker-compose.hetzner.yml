# Hetzner VPS deployment — differs from Cloud Run in:
#   - Images pulled from GHCR (not GCR)
#   - Redis runs as a sidecar (no Cloud Memorystore)
#   - Frontend on :8501, backend API on :8081 (ports 80/443 used by SenStat)
#   - Secrets loaded from .env file on the server

version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: ghcr.io/thioyedev/statiq-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - APP_ENV=production
      - LOG_LEVEL=INFO
    ports:
      - "8081:8080"
    volumes:
      - ./credentials:/app/credentials:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  frontend:
    image: ghcr.io/thioyedev/statiq-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8501:8080"
    environment:
      - BACKEND_URL=http://backend:8080
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis_data:

networks:
  default:
    name: statiq-hetzner
