[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "frontend"]

[project]
name = "statiq"
version = "0.1.0"
description = "AI-Powered Multi-Agent Analytics Platform"
requires-python = ">=3.11"

dependencies = [
  # API
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1.0",
  # AI
  "anthropic>=0.28.0",
  "langgraph>=0.2",
  "langchain>=0.3",
  "langchain-anthropic>=0.3",
  "langchain-core>=0.3",
  "langfuse>=2.0",
  # Data
  "duckdb>=0.10.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "pyarrow>=16.0.0",
  "openpyxl>=3.1.0",
  # Stats
  "scipy>=1.13.0",
  "statsmodels>=0.14.0",
  "pingouin>=0.5.4",
  # Viz
  "matplotlib>=3.8.0",
  "plotly>=5.22.0",
  "seaborn>=0.13.0",
  "kaleido>=0.2.1",
  # Forecast
  "prophet>=1.1.5",
  "neuralforecast>=1.7.0",
  # GCP
  "google-cloud-bigquery>=3.23.0",
  "google-cloud-storage>=2.17.0",
  "google-cloud-firestore>=2.16.0",
  "google-cloud-secret-manager>=2.20.0",
  "db-dtypes>=1.2.0",
  # Memory
  "redis>=5.0.0",
  # Config
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.0",
  # PDF export
  "reportlab>=4.2.0",
  # Utilities
  "tenacity>=8.3.0",
  "structlog>=24.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
]
frontend = [
  "streamlit>=1.35.0",
  "streamlit-extras>=0.4.0",
  "plotly>=5.22.0",
  "requests>=2.32.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
  "eval: LLM-as-judge evaluation (requires API calls, excluded from default runs)",
]
addopts = "-m 'not eval'"
