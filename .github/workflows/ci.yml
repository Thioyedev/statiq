name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check backend/ tests/

      - name: Type check (mypy)
        run: mypy backend/ --ignore-missing-imports

      - name: Unit tests
        run: pytest tests/unit/ -v --tb=short --cov=backend --cov-report=xml --cov-report=term-missing
        env:
          PYTHONPATH: .
          ANTHROPIC_API_KEY: "sk-ant-test"
          GCP_PROJECT_ID: "test-project"
          GCS_BUCKET_NAME: "test-bucket"
          # Langfuse disabled in CI (no keys) — graceful degradation tested implicitly
          LANGFUSE_PUBLIC_KEY: ""
          LANGFUSE_SECRET_KEY: ""

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t statiq-backend:ci .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t statiq-frontend:ci .
