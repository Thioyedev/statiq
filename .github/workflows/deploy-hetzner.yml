name: Deploy → Hetzner

on:
  push:
    branches: [deploy/hetzner]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check backend/ tests/

      - name: Unit tests
        run: pytest tests/unit/ -v --tb=short
        env:
          PYTHONPATH: .
          ANTHROPIC_API_KEY: sk-ant-test
          GCP_PROJECT_ID: test-project
          GCS_BUCKET_NAME: test-bucket
          LANGFUSE_PUBLIC_KEY: ""
          LANGFUSE_SECRET_KEY: ""

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image names
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE=ghcr.io/${REPO}-backend" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=ghcr.io/${REPO}-frontend" >> $GITHUB_ENV

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          provenance: false
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          provenance: false
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: hetzner
    steps:
      - name: Pull images on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 60m
          script: |
            set -e
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin
            IMAGE_TAG=${{ needs.build-push.outputs.tag }} \
              docker compose -f /opt/statiq/docker-compose.hetzner.yml pull

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/statiq
            git fetch origin deploy/hetzner
            git reset --hard origin/deploy/hetzner

            # Tear down compose project
            docker compose -f docker-compose.hetzner.yml down --remove-orphans --timeout 30 || true

            # Force-remove any container (running or stopped) still holding our ports
            docker ps -aq --filter "publish=8501" | xargs -r docker rm -f || true
            docker ps -aq --filter "publish=8081" | xargs -r docker rm -f || true

            # Kill any non-Docker process holding the ports (e.g. orphaned host process)
            fuser -k 8501/tcp 2>/dev/null || true
            fuser -k 8081/tcp 2>/dev/null || true

            sleep 2

            IMAGE_TAG=${{ needs.build-push.outputs.tag }} \
              docker compose -f docker-compose.hetzner.yml up -d
            docker image prune -f

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            sleep 30
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8081/health || echo "000")
            echo "Backend health: $STATUS"
            [ "$STATUS" = "200" ] || (echo "Health check failed" && exit 1)
